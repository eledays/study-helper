{% extends 'base.html' %}
{% block content %}
<div class="analytics-layout" data-today="{{today}}">
  <div class="analytics-toolbar"><label for="analytics-period">Период</label><select id="analytics-period"><option value="28" {{'selected' if period == 28}}>4 недели</option><option value="56" {{'selected' if period == 56}}>8 недель</option><option value="84" {{'selected' if period == 84}}>12 недель</option><option value="365" {{'selected' if period == 365}}>Год</option></select></div>
  <div class="analytics-top">
    <section class="analytics-card" aria-labelledby="rhythm-title">
      <div class="card-heading"><h2 id="rhythm-title">Ритм подготовки</h2><select id="rhythm-subject" aria-label="Предмет для ритма подготовки"><option value="all">Все предметы</option>{% for subject in subjects %}<option value="{{subject.id}}">{{subject.name|display_label}}</option>{% endfor %}</select></div>
      <div id="rhythm-metrics" class="metric-grid" aria-live="polite"></div>
      <div id="rhythm-calendar" class="rhythm-calendar"></div>
      <div class="calendar-caption"><span id="rhythm-range"></span><span class="calendar-key"><i></i> День с занятием</span></div>
    </section>
    <section class="analytics-card" aria-labelledby="exams-title">
      <div class="card-heading"><h2 id="exams-title">Пробники</h2><select id="exam-subject" aria-label="Предмет пробников">{% for subject in subjects %}<option value="{{subject.id}}">{{subject.name|display_label}}</option>{% endfor %}</select></div>
      <div id="exam-metrics" class="metric-grid" aria-live="polite"></div>
      <div id="exam-chart" class="analytics-chart"></div>
      <div id="exam-pending" class="chart-note" hidden><span></span>{% if g.user.id == g.student.id %}<a href="{{url_for('page',section='editing',tab='works',student=g.student.id)}}">Внести баллы →</a>{% endif %}</div>
    </section>
  </div>
  <section class="analytics-card task-analytics" aria-labelledby="tasks-title">
    <div class="card-heading"><h2 id="tasks-title">Задания</h2><div class="card-filters"><select id="task-subject" aria-label="Предмет заданий">{% for subject in subjects %}<option value="{{subject.id}}">{{subject.name|display_label}}</option>{% endfor %}</select><select id="task-kind" aria-label="Тип работ для заданий"><option value="all">Все работы</option><option value="practice">Занятия</option><option value="exam">Пробники</option></select></div></div>
    <label class="mobile-task-select">Задание<select id="task-number"></select></label>
    <div id="task-picker" class="analytics-task-picker" role="group" aria-label="Выбор задания"></div>
    <div class="task-detail-heading"><h3 id="selected-task"></h3><span id="task-last" class="muted"></span></div>
    <div id="task-metrics" class="metric-grid" aria-live="polite"></div>
    <div class="task-detail-grid"><div id="task-chart" class="analytics-chart"></div><div class="task-breakdown"><h3>Результаты решений</h3><div id="task-breakdown"></div></div></div>
  </section>
  {% if data.wellbeing %}<section class="analytics-card"><h2>Самочувствие и нагрузка</h2><div id="wellbeing-chart"></div></section>{% endif %}
</div>
<script type="application/json" id="analytics-data">{{data|tojson}}</script>
{% endblock %}
