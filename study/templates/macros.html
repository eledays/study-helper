{% macro hidden() %}{% if section == 'editing' and tab == 'works' %}<input type="hidden" name="record_page" value="{{record_page}}"><input type="hidden" name="record_subject" value="{{record_subject}}">{% endif %}{% if tab is defined and section == "editing" %}<input type="hidden" name="return_tab" value="{{tab}}">{% endif %}<input type="hidden" name="return_section" value="{{section}}"><input type="hidden" name="csrf" value="{{ csrf }}">{% if week is defined %}<input type="hidden" name="return_week" value="{{week}}">{% endif %}<input type="hidden" name="student" value="{{ g.student.id }}">{% endmacro %}
{% macro subjects_select(subjects, required=true) %}<label>Предмет<select name="subject_id" {{ 'required' if required }}><option value="">Выберите предмет</option>{% for s in subjects %}<option value="{{ s.id }}">{{ s.name|display_label }}</option>{% endfor %}</select></label>{% endmacro %}
{% macro scope() %}<label>Применить изменение<select name="scope" required><option value="one" selected>Только эта неделя</option><option value="future">Эта и следующие</option><option value="all">Весь период, включая прошлое</option></select></label>{% endmacro %}
