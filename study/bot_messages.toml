# Все формулировки Telegram-бота
# Можно менять текст справа от =, добавлять варианты в списки и использовать переносы \n
# В форматированных сообщениях доступны <b>заголовок</b> и <i>подсказка</i>
# Названия разделов, ключи и подстановки в {скобках} сохраняйте
# Даты: {day:%d.%m} → 15.10, {day:%d.%m.%Y} → 15.10.2026
# Предметы, задания, группы и имена берутся из базы и редактируются на сайте
# Изменения подхватываются со следующего сообщения без пересборки образа
# Если редактор заменяет файл при сохранении: docker compose up -d --force-recreate web bot

