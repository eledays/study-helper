[welcome]
greeting = """
Привет 👋
Помогу записывать занятия и следить за подготовкой

Я (бот) буду напоминать о занятиях в соответствии с временными слотами, спрашивать, как прошел день и собирать статистику по решенным заданиям и пробникам

На сайте можно этим всем управлять, настраивать цели, следить за динамикой подготовки, смотреть подробную аналитику: {base_url}

Я не стану назойливым надзирателем, воспринимай мои сообщения как дружеское напоминание, а не обязанность. Выбирать "Сегодня отдых" тоже замечательный вариант. Наша цель — сделать учебу комфротным регулярным занятием 💚

Помощь по управлению — /help"""
help = """
<b>Команды бота</b>

/practice — записать занятие
/exam — записать пробник
/goals — посмотреть цели на текущую неделю
/weekly — посмотреть итоги текущей недели

/rest — отключить сегодняшнее вечернее сообщение

/cancel — отменить текущий ввод

История, редактирование записей, настройки и аналитика: {base_url}"""
invalid_invite = "Это приглашение больше не действует\nПопроси учителя прислать новое"
teacher_invite = "Подключить учителя {teacher_name}?\nУчитель сможет редактировать план и видеть результаты\nДоступ к самочувствию можно отключить в настройках"
teacher_connected = "Учитель подключён\nДоступ к самочувствию можно изменить в настройках на сайте"

