services:
  web:
    build: .
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - study-data:/app/data
      - ./study/bot_messages.toml:/app/study/bot_messages.toml:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  bot:
    build: .
    env_file: .env
    depends_on:
      web:
        condition: service_healthy
    command: python -m study.bot
    volumes:
      - study-data:/app/data
      - ./study/bot_messages.toml:/app/study/bot_messages.toml:ro
    restart: unless-stopped
volumes:
  study-data:
