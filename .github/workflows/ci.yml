name: checks
on:
  push:
  pull_request:
  schedule:
    - cron: '23 7 * * 1'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip check
      - run: python -m pytest -q
      - run: node --check study/static/app.js
      - run: npm install --prefix /tmp/study-browser-tools playwright@1.62.1
      - run: /tmp/study-browser-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Browser scenarios
        run: |
          python tests/browser_server.py >/tmp/study-browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/health >/dev/null; then break; fi
            sleep 1
          done
          NODE_PATH=/tmp/study-browser-tools/node_modules node tests/browser_smoke.cjs
      - run: docker build --pull -t study-helper:ci .
      - run: bash deploy/smoke.sh study-helper:ci
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements.lock --disable-pip --no-deps --progress-spinner off
